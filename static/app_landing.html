<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SyncAura — music, together</title>
<meta property="og:title" content="SyncAura — music, together">
<meta property="og:description" content="Free music streaming with videos, synced lyrics, and real-time listening rooms. Get the app.">
<meta property="og:type" content="website">
<meta property="og:image" content="__ICON__">
<link rel="icon" href="__ICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
  :root{
    --bg:#0a0506; --text:#f4eeea; --dim:#9b8d87;
    --ember:#ff5a1f; --ember2:#ff8a3d; --crimson:#e6391f; --deep:#7a1708;
  }
  *{box-sizing:border-box; margin:0}
  html,body{height:100%; overflow-x:hidden}
  body{
    background:
      radial-gradient(900px 540px at 85% 110%, rgba(230,57,31,.22), transparent 60%),
      radial-gradient(700px 420px at 8% -8%, rgba(255,90,31,.14), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:"Manrope",-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    /* svh, not vh: on mobile 100vh ignores the collapsing URL bar and
       mints exactly the phantom vertical scroll this page must not have. */
    min-height:100vh; min-height:100svh;
    position:relative;
  }
  .orb{position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none}
  .orb.a{width:360px;height:360px; background:var(--crimson); opacity:.22; top:-130px; left:-110px;
         animation:drift 18s ease-in-out infinite alternate}
  .orb.b{width:300px;height:300px; background:var(--ember); opacity:.16; bottom:-130px; right:-110px;
         animation:drift 22s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translate(0,0) scale(1)} to{transform:translate(55px,35px) scale(1.12)}}

  #sparks{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0}
  .card{position:relative; z-index:1; text-align:center; padding:52px 28px 44px; max-width:430px; width:100%}

  .mark{position:relative; width:128px; height:128px; margin:0 auto 24px}
  .mark img{
    position:absolute; inset:10px; width:108px; height:108px;
    border-radius:27%;
    box-shadow:0 14px 48px rgba(230,57,31,.45), 0 2px 10px rgba(0,0,0,.6);
  }

  h1{font-size:42px; font-weight:800; letter-spacing:-.5px}
  h1 .a{background:linear-gradient(100deg,var(--ember2),var(--crimson));
        -webkit-background-clip:text; background-clip:text; color:transparent}
  .tag{color:var(--dim); font-size:15px; margin:10px 0 30px; line-height:1.6; padding:0 10px}
  .tag b{color:#d8cdc7; font-weight:600}

  .chips{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:34px 0 0}
  .chip{
    font-size:12.5px; font-weight:600; color:#d8cdc7;
    border:1px solid rgba(255,138,61,.18); background:rgba(255,90,31,.06);
    padding:8px 14px; border-radius:999px;
  }
  .chip i{font-style:normal; margin-right:7px; color:var(--ember2)}

  a.btn{
    display:inline-block; text-decoration:none; color:#fff; font-weight:800; font-size:17px;
    padding:16px 48px; border-radius:16px;
    background:linear-gradient(135deg,#ff8a3d,var(--ember) 50%,#d92d12);
    box-shadow:0 12px 40px rgba(230,57,31,.42), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  a.btn:hover{transform:translateY(-2px);
    box-shadow:0 16px 48px rgba(230,57,31,.55), inset 0 1px 0 rgba(255,255,255,.28)}
  a.btn:active{transform:translateY(0)}
  .ver{margin-top:16px; font-size:12.5px; color:#6b5d57}
  .ver b{color:var(--dim); font-weight:600}

  /* Short viewports (small phones, landscape): tighten the rhythm so the
     whole card fits with zero vertical scroll. */
  @media (max-height: 720px){
    .card{padding:24px 24px 20px}
    .mark{width:92px; height:92px; margin-bottom:16px}
    .mark img{inset:6px; width:80px; height:80px}
    h1{font-size:32px}
    .tag{font-size:13.5px; margin:8px 0 20px}
    a.btn{padding:13px 38px; font-size:15px}
    .ver{margin-top:10px}
    .chips{margin-top:22px}
  }

  @media (prefers-reduced-motion: reduce){
    .orb{animation:none}
  }
</style>
</head>
<body>
<div class="orb a"></div>
<div class="orb b"></div>
<canvas id="sparks"></canvas>
<main class="card">
  <div class="mark" aria-hidden="true">
    <img src="__ICON__" alt="">
  </div>
  <h1>Sync<span class="a">Aura</span></h1>
  <p class="tag">Stream free music with <b>videos</b> and <b>synced lyrics</b> —
     or open a room and listen <b>together, in real time</b>.</p>
  <a class="btn" href="__APK__">Download for Android</a>
  <div class="ver">Version <b>__VER__</b> · free APK · no account needed</div>
  <div class="chips">
    <span class="chip"><i>♪</i>Free streaming</span>
    <span class="chip"><i>▶</i>Music videos</span>
    <span class="chip"><i>❝</i>Live lyrics</span>
    <span class="chip"><i>⟡</i>Listen Together</span>
  </div>
</main>
<script>
// Ember lightning: a thin jagged wire forms at a random edge and travels
// across the frame. Along the way it breaks into stretches of dancing
// waveform bars (the logo's wave) and then re-forms into wire again —
// finally exiting the frame while the whole tail fades like afterglow.
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.getElementById('sparks');
  var cx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  function size() {
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size(); addEventListener('resize', size);

  var COLORS = ['#ff8a3d', '#ff5a1f', '#e6391f', '#ffb36b'];
  var bolts = [];
  var MAX = 3;

  function spawn() {
    // Any edge, aimed inward with a wide spread — horizontals, verticals
    // and true diagonals all occur.
    var edge = Math.random() * 4 | 0;   // 0 left, 1 right, 2 top, 3 bottom
    var x, y, base;
    if (edge === 0)      { x = -30;    y = H * Math.random(); base = 0; }
    else if (edge === 1) { x = W + 30; y = H * Math.random(); base = Math.PI; }
    else if (edge === 2) { x = W * Math.random(); y = -30;    base = Math.PI / 2; }
    else                 { x = W * Math.random(); y = H + 30; base = -Math.PI / 2; }
    var ang = base + (Math.random() - 0.5) * 1.1;
    bolts.push({
      x: x,
      y: y,
      ang: ang,
      speed: 300 + Math.random() * 320,
      color: COLORS[Math.random() * COLORS.length | 0],
      scale: 0.7 + Math.random() * 0.7,
      barLife: 600 + Math.random() * 450,
      traveled: 0, sinceEmit: 0,
      // mode machine: wire <-> wave, random run lengths
      wave: false, modeLeft: 90 + Math.random() * 160,
      gap: 6,
      jit: 0, wobA: 12 + Math.random() * 16,
      wobF: (0.8 + Math.random()) / 90, wavePh: 0,
      trail: [], out: false,
      last: performance.now()
    });
  }

  function frame(now) {
    cx.clearRect(0, 0, W, H);
    for (var s = bolts.length - 1; s >= 0; s--) {
      var p = bolts[s];
      var dt = Math.min(now - p.last, 64); p.last = now;
      if (!p.out) {
        var dist = p.speed * dt / 1000;
        p.traveled += dist; p.sinceEmit += dist;
        p.x += Math.cos(p.ang) * dist;
        p.y += Math.sin(p.ang) * dist;
        while (p.sinceEmit >= p.gap) {
          p.sinceEmit -= p.gap;
          p.modeLeft -= p.gap;
          if (p.modeLeft <= 0) {
            p.wave = !p.wave;
            if (p.wave) {
              p.modeLeft = 50 + Math.random() * 110;   // short wave bursts
              p.wavePh = Math.random() * 6.28;
              p.gap = 10;                               // bar spacing
            } else {
              p.modeLeft = 90 + Math.random() * 200;   // longer wire runs
              p.gap = 6;                                // smooth wire
              p.jit = 0;
            }
          }
          var off;
          if (p.wave) {
            // smooth sine: the bolt "sings" here
            off = Math.sin(p.traveled * p.wobF * 6.283 + p.wavePh) * p.wobA;
          } else {
            // jagged random walk with occasional hard kinks: electricity
            p.jit += (Math.random() - 0.5) * 14;
            if (Math.random() < 0.08) p.jit += (Math.random() < 0.5 ? -22 : 22);
            p.jit = Math.max(-24, Math.min(24, p.jit));
            off = p.jit;
          }
          p.trail.push({
            x: p.x - Math.sin(p.ang) * off,
            y: p.y + Math.cos(p.ang) * off,
            wave: p.wave,
            h: (9 + Math.random() * 20) * p.scale,
            born: now,
            ph: Math.random() * 6.28
          });
        }
        if (p.x < -60 || p.x > W + 60 || p.y < -60 || p.y > H + 60) p.out = true;
      }

      cx.strokeStyle = p.color;
      cx.fillStyle = p.color;
      cx.shadowColor = p.color;
      cx.lineCap = 'round';
      var bw = 3 * p.scale;

      var prev = null;
      for (var i = 0; i < p.trail.length; i++) {
        var b = p.trail[i];
        var age = (now - b.born) / p.barLife;
        if (age >= 1) { p.trail.splice(i, 1); i--; prev = null; continue; }
        var fade = (1 - age) * (1 - age);
        if (b.wave) {
          // waveform burst: a bar PERPENDICULAR to the travel direction
          // (a vertical-only bar collapses into a blob on steep bolts),
          // drawn as a round-capped stroke so any angle renders clean.
          var hh = b.h * (0.55 + 0.45 * Math.abs(Math.sin(now / 1000 * 5 + b.ph)))
                       * (0.45 + 0.55 * (1 - age));
          var ux = -Math.sin(p.ang) * hh / 2, uy = Math.cos(p.ang) * hh / 2;
          cx.globalAlpha = fade * 0.55;
          cx.shadowBlur = 12 * fade;
          cx.lineWidth = bw;
          cx.beginPath();
          cx.moveTo(b.x - ux, b.y - uy);
          cx.lineTo(b.x + ux, b.y + uy);
          cx.stroke();
          prev = null;   // a bar breaks the wire
        } else {
          // lightning wire: segment to the previous wire point
          if (prev) {
            cx.globalAlpha = fade * 0.6;
            cx.shadowBlur = 10 * fade;
            cx.lineWidth = 1.7 * p.scale;
            cx.beginPath();
            cx.moveTo(prev.x, prev.y);
            cx.lineTo(b.x, b.y);
            cx.stroke();
          }
          prev = b;
        }
      }

      // bright head while in frame
      if (!p.out) {
        cx.globalAlpha = 0.9;
        cx.shadowBlur = 16;
        cx.beginPath();
        cx.arc(p.x, p.y, 2.2 * p.scale, 0, 6.283);
        cx.fill();
      }
      if (p.out && p.trail.length === 0) bolts.splice(s, 1);
    }
    cx.globalAlpha = 1; cx.shadowBlur = 0;
    if (bolts.length < MAX && Math.random() < 0.02) spawn();
    requestAnimationFrame(frame);
  }
  spawn();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
