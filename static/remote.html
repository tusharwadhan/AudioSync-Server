<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SyncAura Remote</title>
<style>
  :root{
    --bg:#0b0c10; --panel:#14161d; --line:rgba(255,255,255,.09);
    --line2:rgba(255,255,255,.16); --text:#eef0f4; --dim:#8b909c;
    --accent:#A855F7; --accent2:#c98bff; --cyan:#3ddbd9;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1100px 700px at 50% -10%,#1a1c25,#08090c 62%);
    color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;
    display:grid;place-items:center;padding:24px}
  .card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);
    border-radius:22px;padding:26px;box-shadow:0 30px 70px rgba(0,0,0,.55)}
  h1{margin:0 0 4px;font-size:17px;font-weight:750;letter-spacing:-.01em}
  .sub{margin:0 0 20px;font-size:13px;color:var(--dim);line-height:1.5}

  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:#666;margin-right:7px;vertical-align:middle}
  .dot.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  .dot.warn{background:#ffb86b}

  input{width:100%;height:52px;background:#0e1016;border:1px solid var(--line2);
    border-radius:13px;color:var(--text);font-family:var(--font);font-size:20px;
    font-weight:700;letter-spacing:.32em;text-align:center;text-transform:uppercase;
    outline:none}
  input:focus{border-color:var(--accent)}
  button{font-family:var(--font);cursor:pointer;border:0}
  .primary{width:100%;height:48px;margin-top:12px;border-radius:13px;
    background:var(--accent);color:#12061f;font-size:14px;font-weight:750}
  .primary:disabled{opacity:.45;cursor:default}
  .err{margin-top:11px;font-size:12.5px;color:#ff9a9a;min-height:17px}

  .np{display:flex;gap:15px;align-items:center;margin-bottom:20px;position:relative}
  .art{width:74px;height:74px;border-radius:14px;flex:0 0 auto;
    box-shadow:0 10px 26px rgba(0,0,0,.5);
    background:linear-gradient(140deg,#3a2b57,#1d2233);display:grid;place-items:center;
    font-size:22px;
    /* After the shorthand, not before — `background:` resets both of these,
       so declaring them first meant the artwork never actually rendered. */
    background-size:cover;background-position:center}
  .meta{min-width:0;flex:1}
  .t{font-size:15.5px;font-weight:700;line-height:1.3;letter-spacing:-.01em;
     display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
     overflow:hidden}
  .a{font-size:12.5px;color:var(--accent2);margin-top:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .bar{height:5px;background:rgba(255,255,255,.10);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:4px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .25s linear}
  .times{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);
    margin-top:7px;font-variant-numeric:tabular-nums}

  .row{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
  .tp{width:52px;height:52px;border-radius:50%;background:transparent;color:var(--text);
    display:grid;place-items:center;transition:.15s}
  .tp:hover{background:rgba(255,255,255,.08)}
  .tp svg{width:26px;height:26px;fill:currentColor}
  .tp.play{width:62px;height:62px;background:#fff;color:#000;
    box-shadow:0 6px 20px rgba(255,255,255,.14)}
  .tp.play:hover{background:#e9e9e9;transform:scale(1.04)}
  .tp.play:active{transform:scale(.97)}
  .tp.play svg{width:27px;height:27px}

  .vol{display:flex;align-items:center;gap:11px;margin-top:20px}
  .vol svg{width:17px;height:17px;fill:var(--dim);flex:0 0 auto}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;padding:0;
    background:rgba(255,255,255,.14);border:0;border-radius:4px;letter-spacing:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:#fff;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;
    background:#fff;cursor:pointer}

  .search{display:flex;align-items:center;gap:10px;margin-top:22px}
  /* The base `input` rule is the PAIRING CODE field: 20px/700, .32em tracking,
     uppercase, centred. `font:inherit` resets size/weight/family but NOT
     letter-spacing, text-transform or text-align -- which is why this box was
     rendering "S E A R C H   F O R   A   S O N G". Undo all three explicitly. */
  .search input{flex:1;height:42px;background:#0e1016;border:1px solid var(--line);
    color:inherit;border-radius:11px;padding:0 13px;font:inherit;font-size:13.5px;
    font-weight:500;letter-spacing:normal;text-transform:none;text-align:left;
    outline:none;transition:border-color .15s,background .15s}
  .search input::placeholder{color:var(--dim);font-weight:400}
  .search input:focus{border-color:var(--accent);background:#111420}
  .lhead{margin:20px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    opacity:.55}
  /* Capped so a long queue scrolls inside its own box instead of pushing the
     transport controls off-screen — the controls are the reason the page exists. */
  .list{max-height:300px;overflow-y:auto;overflow-x:hidden;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
  .list::-webkit-scrollbar{width:6px}
  .list::-webkit-scrollbar-track{background:transparent}
  .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
  .list::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26)}
  /* Fades the last row instead of clipping it mid-glyph, so it reads as
     "more below" rather than as a rendering fault. */
  .listwrap{position:relative}
  .listwrap::after{content:'';position:absolute;left:0;right:6px;bottom:0;height:34px;
    background:linear-gradient(transparent,var(--panel));pointer-events:none}
  .qrow{display:flex;align-items:center;gap:11px;padding:8px 8px;border-radius:10px;
    cursor:pointer;transition:background .12s}
  .qrow:hover{background:rgba(255,255,255,.055)}
  .qrow img{width:44px;height:44px;object-fit:cover;border-radius:6px;flex:0 0 auto;
    background:#111}
  .qmeta{flex:1;min-width:0}
  .qt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qa{font-size:11px;opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qbadge{font-size:10px;opacity:.45;border:1px solid var(--line);border-radius:5px;
    padding:2px 5px;flex:0 0 auto}
  .qadd{background:none;border:1px solid var(--line);color:inherit;border-radius:6px;
    width:26px;height:26px;font-size:15px;line-height:1;cursor:pointer;flex:0 0 auto;opacity:.6}
  .qadd:hover{opacity:1;border-color:#666}
  .qrow.flash{background:#16241a}
  .empty{font-size:12px;opacity:.4;padding:10px 4px}
  .foot{margin-top:20px;padding-top:15px;border-top:1px solid var(--line);
    font-size:12px;color:var(--dim);display:flex;justify-content:space-between;
    align-items:center}
  .link{background:none;color:var(--dim);font-size:12px;text-decoration:underline}
  .hide{display:none!important}
</style>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>

<div class="card">

  <div id="pairView">
    <h1>SyncAura Remote</h1>

    <div id="quickView">
      <p class="sub">Sign in and your phone will ask you to approve — no code needed.</p>
      <button class="primary" id="signInBtn">Sign in with Google</button>
      <button class="primary hide" id="askBtn">Connect to my phone</button>
      <div id="whoami" class="sub hide"></div>
      <div id="digits" class="hide">
        <div class="sub">Check these match your phone</div>
        <div id="digitsVal"></div>
      </div>
      <div class="err" id="quickErr"></div>
      <div class="sub"><a href="#" id="useCode">Use a pairing code instead</a></div>
    </div>

    <div id="codeView" class="hide">
      <p class="sub">Open SyncAura on your phone, go to <b>Remote</b>, and type the
         six characters it shows.</p>
      <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters"
             spellcheck="false" placeholder="······" aria-label="Pairing code">
      <button class="primary" id="pairBtn" disabled>Connect</button>
      <div class="err" id="pairErr"></div>
      <div class="sub"><a href="#" id="useAccount">Use my account instead</a></div>
    </div>
  </div>

  <style>
    #digitsVal { font-size: 2.1rem; letter-spacing: .5rem; font-weight: 700;
                 margin: .3rem 0 .6rem; }
    #quickView a, #codeView a { color: inherit; opacity: .7; }
  </style>

  <div id="playerView" class="hide">
    <div class="np">
      <div class="art" id="art">♪</div>
      <div class="meta">
        <div class="t" id="title">—</div>
        <div class="a" id="artist"></div>
      </div>
    </div>

    <div class="bar"><i id="prog"></i></div>
    <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>

    <div class="row">
      <button class="tp" id="prev" title="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg></button>
      <button class="tp play" id="play" title="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="tp" id="next" title="Next">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-2 6L5.5 18V6z"/></svg></button>
    </div>

    <div class="vol">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4z"/></svg>
      <input type="range" id="vol" min="0" max="100" value="70" style="flex:1">
    </div>

    <div class="search">
      <input type="search" id="q" placeholder="Search for a song…" autocomplete="off">
      <button class="link" id="qclear">Clear</button>
    </div>
    <div id="results" class="list hide"></div>

    <div class="lhead" id="qhead">Up next</div>
    <div class="listwrap"><div id="queue" class="list"></div></div>

    <div class="foot">
      <span><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
      <button class="link" id="unpair">Disconnect</button>
    </div>
  </div>

</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  // Same origin as the page, so this works on localhost and in production
  // without a build step or a hardcoded host.
  var WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://')
             + location.host + '/api/v1/ws';

  var ws = null, paired = false, st = {}, drift = null, retry = 0;
  // Held so a click on a result can send the metadata back: a searched song is
  // in no queue yet, so the phone has no other source for its title/artist.
  var lastResults = [];
  // When we last flipped play/pause locally. A state push already in flight
  // carries the value from BEFORE the command, and letting it win made the
  // button flip back and then forward again - one click, three transitions.
  var optimisticUntil = 0;

  function fmt(s){
    s = Math.max(0, Math.floor(s || 0));
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }

  function setStatus(text, cls){
    $('status').textContent = text;
    $('dot').className = 'dot' + (cls ? ' ' + cls : '');
  }

  // ── account sign-in ───────────────────────────────────────────────────
  //
  // The apiKey is not a secret: it identifies the project, it does not
  // authorise anything. What actually constrains it is Firebase's Authorized
  // Domains list, which decides where a sign-in may be completed.
  var FB = {
    apiKey: "AIzaSyBhq-A6-lRXzouutJzsq8UXYlc7TApVNI8",
    authDomain: "audiosync-dfee2.firebaseapp.com",
    projectId: "audiosync-dfee2",
    appId: "1:823868308702:web:3dec16fc2003085ed4164f"
  };
  var fbAuth = null, authed = false;

  function quickErr(msg){ $('quickErr').textContent = msg || ''; }

  function initAuth(){
    if (typeof firebase === 'undefined') {
      // The SDK failed to load (offline, blocked, CDN down). Do not strand the
      // user on a dead button — the code flow still works.
      showCodeView();
      return;
    }
    firebase.initializeApp(FB);
    fbAuth = firebase.auth();
    fbAuth.onAuthStateChanged(function(user){
      if (user) {
        $('signInBtn').classList.add('hide');
        $('askBtn').classList.remove('hide');
        $('whoami').classList.remove('hide');
        $('whoami').textContent = user.email || user.displayName || 'Signed in';
        sendAuth(user);
      } else {
        $('signInBtn').classList.remove('hide');
        $('askBtn').classList.add('hide');
        $('whoami').classList.add('hide');
        authed = false;
      }
    });
  }

  // Re-sent on every socket open: ws_auth is per-CONNECTION, so a reconnect
  // silently drops the identity and control_request would answer not_signed_in.
  function sendAuth(user){
    if (!user || !ws || ws.readyState !== 1) return;
    user.getIdToken().then(function(tok){
      send({type: 'ws_auth', idToken: tok});
    }).catch(function(){ quickErr('Could not verify your sign-in. Try again.'); });
  }

  function showCodeView(){
    $('quickView').classList.add('hide');
    $('codeView').classList.remove('hide');
  }
  function showQuickView(){
    $('codeView').classList.add('hide');
    $('quickView').classList.remove('hide');
  }

  function send(obj){
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
  }

  function cmd(action, value){
    send({type:'control_cmd', action:action, value:(value===undefined?null:value)});
  }

  // Thumbnails are rebuilt here rather than sent. The phone's state push has a
  // hard 8KB ceiling on the server and an oversized push is rejected whole —
  // which would blank the remote, not just the list — so ~110 bytes of URL per
  // row is not worth spending when the id determines it.
  function thumb(videoId){
    return 'https://i.ytimg.com/vi/' + videoId + '/mqdefault.jpg';
  }

  function rowHtml(item, badge, withQueueBtn){
    return '<div class="qrow" data-id="' + item.videoId + '">' +
             '<img loading="lazy" src="' + thumb(item.videoId) + '" alt="">' +
             '<div class="qmeta">' +
               '<div class="qt">' + esc(item.title || '') + '</div>' +
               '<div class="qa">' + esc(item.artist || '') + '</div>' +
             '</div>' +
             (badge ? '<span class="qbadge">' + badge + '</span>' : '') +
             // Separate control rather than a row mode: tapping a result
             // should play it, and queuing is the deliberate second choice.
             (withQueueBtn ? '<button class="qadd" title="Add to queue">+</button>' : '') +
           '</div>';
  }

  // Momentary confirmation. Queuing produces no visible change up here — the
  // row stays put and the queue list is below the fold — so without this the
  // click looks like it did nothing.
  function flash(el){
    el.classList.add('flash');
    setTimeout(function(){ el.classList.remove('flash'); }, 600);
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderQueue(){
    var list = st.upNext || [];
    if (!list.length) {
      $('queue').innerHTML = '<div class="empty">Nothing queued</div>';
      return;
    }
    $('queue').innerHTML = list.map(function(it){
      return rowHtml(it, it.queued ? 'queued' : '', false);
    }).join('');
  }

  function renderResults(results){
    if (!results.length) {
      $('results').innerHTML = '<div class="empty">No results</div>';
      return;
    }
    $('results').innerHTML = results.map(function(it){ return rowHtml(it, '', true); }).join('');
  }

  function render(){
    $('title').textContent  = st.title  || '—';
    $('artist').textContent = st.artist || '';
    // Built from the id, not sent: the phone holds artwork as a bitmap it
    // cannot forward, and a URL would eat the state budget.
    if (st.videoId) {
      $('art').style.backgroundImage = 'url(' + thumb(st.videoId) + ')';
      $('art').textContent = '';
    } else {
      $('art').style.backgroundImage = '';
      $('art').textContent = '♪';
    }
    renderQueue();
    $('dur').textContent    = fmt(st.duration);
    $('playIcon').innerHTML = st.isPlaying
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    if (typeof st.volume === 'number' && document.activeElement !== $('vol')) {
      $('vol').value = Math.round(st.volume * 100);
    }
    tick();
  }

  // The phone pushes state every few seconds; advance the playhead locally
  // between pushes so the bar moves smoothly instead of stepping.
  function tick(){
    var p = st.position || 0;
    if (st.isPlaying && drift != null) p += (Date.now() - drift) / 1000;
    if (st.duration) p = Math.min(p, st.duration);
    $('pos').textContent = fmt(p);
    $('prog').style.width = st.duration ? (p / st.duration * 100) + '%' : '0%';
  }
  setInterval(tick, 500);

  function connect(){
    ws = new WebSocket(WS_URL);

    ws.onopen = function(){
      retry = 0;
      // Any in-flight approval died with the old socket, and the server has
      // no way to reach this browser again — it gets a fresh client_id on
      // every reconnect and holds no rejoin secret.
      if (!paired) { clearPendingTimer(); resetPairButton(); setStatus('ready to pair'); }
      authed = false;
      if (fbAuth && fbAuth.currentUser) sendAuth(fbAuth.currentUser);
    };

    ws.onmessage = function(ev){
      var m; try { m = JSON.parse(ev.data); } catch(e){ return; }

      if (m.type === 'control_joined') {
        // Approved. Without this the 70s timer keeps running and fires
        // mid-session, writing "No answer from your phone" over a session that
        // is working.
        clearPendingTimer();
        paired = true;
        $('pairView').classList.add('hide');
        $('playerView').classList.remove('hide');
        st = m.state || {}; drift = Date.now(); render();
        setStatus('connected', 'on');

      } else if (m.type === 'control_search') {
        lastResults = m.results || [];
        renderResults(lastResults);
        $('results').classList.remove('hide');
        $('qhead').classList.add('hide');
        $('queue').classList.add('hide');

      } else if (m.type === 'control_state') {
        var incoming = m.state || {};
        // Keep our own play-state for a moment; take everything else.
        if (Date.now() < optimisticUntil && 'isPlaying' in incoming) {
          incoming.isPlaying = st.isPlaying;
        }
        st = incoming; drift = Date.now(); render();
        setStatus('connected', 'on');

      } else if (m.type === 'control_error') {
        if (m.code === 'bad_code') {
          fail('That code didn’t work. It expires after 90 seconds — ask the phone for a new one.');
        } else if (m.code === 'rate_limited') {
          fail('Too many attempts. Wait a moment and try again.');
        } else if (m.code === 'not_paired') {
          setStatus('phone disconnected', 'warn');
        } else if (m.code === 'guest_in_room') {
          setStatus("host controls playback", 'warn');
        } else if (m.code === 'player_not_ready') {
          setStatus('nothing playing on the phone', 'warn');
        } else if (m.code === 'phone_offline') {
          fail('Your phone isn’t connected right now. Try the same code again in a moment.');
        } else if (m.code === 'phone_unreachable') {
          fail('Couldn’t wake your phone. Open SyncAura and try again.');
        } else if (m.code === 'phone_needs_update') {
          fail('Update SyncAura on your phone to approve this connection.');
        } else if (m.code === 'busy') {
          fail('Your phone is already being asked to approve another computer.');
        } else if (m.code === 'denied') {
          fail('Declined on your phone. Ask it for a new code to try again.');
        } else if (m.code === 'expired') {
          fail('That request timed out. Ask the phone for a new code.');
        } else if (m.code === 'cancelled') {
          fail('Approval was interrupted on your phone. Try the same code again.');
        } else if (m.code === 'no_device') {
          quickErr('No phone signed in to this account is reachable. Open SyncAura on your phone, or use a pairing code.');
          resetPairButton();
        } else if (m.code === 'not_signed_in') {
          quickErr('Sign in first, or use a pairing code.');
          resetPairButton();
        } else if (m.code === 'throttled') {
          fail('Too many approval requests. Wait a minute and try again.');
        } else {
          // Every remaining code MUST land here. pairBtn is disabled the moment
          // Connect is pressed and fail() is the only thing that re-enables it,
          // so an unhandled code leaves the button stuck on "Connecting…"
          // forever — including any code added to the server after this page
          // was cached.
          fail('Couldn’t connect (' + (m.code || 'unknown') + ').');
        }

      } else if (m.type === 'ws_auth_ok') {
        authed = true;

      } else if (m.type === 'ws_auth_error') {
        authed = false;
        quickErr('Could not verify your sign-in. Use a pairing code.');

      } else if (m.type === 'control_requested') {
        // Show the digits BEFORE the phone is approved, so the user has
        // something to compare against the prompt rather than after the fact.
        $('digitsVal').textContent = m.pairDigits || '';
        $('digits').classList.remove('hide');
        setStatus('waiting for approval on your phone', 'warn');

      } else if (m.type === 'control_pending') {
        // Approval is being asked for on the phone. Can legitimately take a
        // while: the phone may be dozing and has to be woken first.
        clearPendingTimer();
        pendingTimer = setTimeout(function(){
          pendingTimer = null;
          fail('No answer from your phone. Ask it for a new code and try again.');
        }, 70000);
        $('pairBtn').textContent = 'Check your phone…';
        setStatus('waiting for approval on your phone', 'warn');

      } else if (m.type === 'control_closed') {
        paired = false;
        // Back to the pair screen, so the button must be usable again — it is
        // still disabled reading "Check your phone…" from the join that got us
        // here. This is the same wedge the default error branch exists to
        // prevent, on the one path that does not go through fail().
        clearPendingTimer();
        resetPairButton();
        setStatus(m.reason === 'phone_gone' ? 'phone went offline' : 'session ended', 'warn');
        setTimeout(function(){
          $('playerView').classList.add('hide');
          $('pairView').classList.remove('hide');
          $('pairErr').textContent = 'The phone ended the session. Pair again to reconnect.';
        }, 1200);

      } else if (m.type === 'control_phone_quiet') {
        // Grace window: the phone's socket dropped but the session is held
        // open for it to come back. Saying "connected" here made every
        // command look like it silently did nothing.
        setStatus('phone reconnecting…', 'warn');
      } else if (m.type === 'control_phone_back') {
        setStatus('connected', 'on');
      }
    };

    ws.onclose = function(){
      setStatus('reconnecting…', 'warn');
      // Without this the button stays on "Connecting…"/"Check your phone…"
      // through every reconnect, because fail() is the only other thing that
      // restores it and nothing calls fail() on a transport drop.
      if (!paired) { clearPendingTimer(); resetPairButton(); }
      // The browser has no rejoin secret, so a dropped socket means
      // re-pairing. Back off rather than hammering a server that may be
      // restarting (free tier spins down).
      retry = Math.min(retry + 1, 6);
      setTimeout(connect, Math.min(1000 * Math.pow(2, retry - 1), 20000));
    };

    ws.onerror = function(){ /* onclose handles it */ };
  }

  var pendingTimer = null;
  function clearPendingTimer(){
    if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
  }

  function fail(msg){
    clearPendingTimer();
    $('pairErr').textContent = msg;
    $('pairBtn').disabled = false;
    $('pairBtn').textContent = 'Connect';
  }

  function resetPairButton(){
    var b = $('pairBtn');
    b.textContent = 'Connect';
    b.disabled = $('code').value.length !== 6;
    var a = $('askBtn');
    a.textContent = 'Connect to my phone';
    a.disabled = false;
    $('digits').classList.add('hide');
  }

  // ── pairing ──
  $('code').addEventListener('input', function(){
    this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    $('pairBtn').disabled = this.value.length !== 6;
    $('pairErr').textContent = '';
  });
  $('code').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && this.value.length === 6) $('pairBtn').click();
  });
  $('signInBtn').addEventListener('click', function(){
    quickErr('');
    if (!fbAuth) { quickErr('Sign-in unavailable. Use a pairing code.'); return; }
    var provider = new firebase.auth.GoogleAuthProvider();
    fbAuth.signInWithPopup(provider).catch(function(e){
      // Popups are blocked often enough that a bare failure looks like a bug.
      quickErr(e && e.code === 'auth/popup-blocked'
        ? 'Your browser blocked the sign-in popup.'
        : 'Sign-in failed. You can use a pairing code instead.');
    });
  });

  $('askBtn').addEventListener('click', function(){
    quickErr('');
    $('digits').classList.add('hide');
    if (!ws || ws.readyState !== 1) { quickErr('Not connected to the server yet.'); return; }
    if (!authed) { quickErr('Still verifying your sign-in — try again in a second.'); return; }
    this.disabled = true; this.textContent = 'Asking your phone…';
    send({type: 'control_request'});
  });

  $('useCode').addEventListener('click', function(e){ e.preventDefault(); showCodeView(); });
  $('useAccount').addEventListener('click', function(e){ e.preventDefault(); showQuickView(); });

  $('pairBtn').addEventListener('click', function(){
    if (!ws || ws.readyState !== 1) { fail('Not connected to the server yet.'); return; }
    this.disabled = true; this.textContent = 'Connecting…';
    send({type:'control_join', code:$('code').value});
  });

  // ── transport ──
  $('play').addEventListener('click', function(){
    // Optimistic: flip locally so the button feels instant, then let the
    // phone's next state push confirm or correct it.
    st.isPlaying = !st.isPlaying;
    optimisticUntil = Date.now() + 1200;
    render();
    cmd(st.isPlaying ? 'play' : 'pause');
  });
  $('next').addEventListener('click', function(){ cmd('next'); });
  $('prev').addEventListener('click', function(){ cmd('previous'); });

  // Debounced: every keystroke would otherwise be a round-trip to the phone
  // and a search on the server, and the browser's commands are rate-limited —
  // typing fast would spend the budget and get the real query throttled.
  var searchTimer = null;
  $('q').addEventListener('input', function(){
    var q = this.value.trim();
    clearTimeout(searchTimer);
    if (!q) { showQueue(); return; }
    searchTimer = setTimeout(function(){ cmd('search', q); }, 350);
  });
  $('q').addEventListener('keydown', function(e){
    if (e.key === 'Enter') { clearTimeout(searchTimer); cmd('search', this.value.trim()); }
  });
  $('qclear').addEventListener('click', function(){ $('q').value = ''; showQueue(); });

  function showQueue(){
    lastResults = [];
    $('results').classList.add('hide');
    $('qhead').classList.remove('hide');
    $('queue').classList.remove('hide');
  }

  // One listener per list rather than one per row: rows are replaced on every
  // state push, and per-row handlers would be re-bound several times a second.
  $('queue').addEventListener('click', function(e){
    var row = e.target.closest('.qrow');
    if (row) cmd('play_item', row.dataset.id);
  });
  $('results').addEventListener('click', function(e){
    var row = e.target.closest('.qrow');
    if (!row) return;
    var hitQ = lastResults.filter(function(r){ return r.videoId === row.dataset.id; })[0];
    if (e.target.closest('.qadd')) {
      if (hitQ) { cmd('queue_item', hitQ); flash(row, 'queued'); }
      return;
    }
    // Send the metadata with it: this song is not in any queue yet, so the
    // phone has no other way to know its title or artist.
    var hit = lastResults.filter(function(r){ return r.videoId === row.dataset.id; })[0];
    if (hit) cmd('play_search', hit);
  });
  $('vol').addEventListener('change', function(){ cmd('volume', this.value / 100); });
  $('unpair').addEventListener('click', function(){
    paired = false;
    // Actually detach. Hiding the UI locally left the socket open and the
    // server still holding this controller, so the PHONE went on saying
    // "Connected" to a browser that had walked away. Closing makes the
    // server's disconnect path detach us and tell the phone; onclose then
    // reconnects for the next pairing.
    if (ws && ws.readyState === 1) { try { ws.close(); } catch (e) {} }
    $('playerView').classList.add('hide');
    $('pairView').classList.remove('hide');
    $('code').value = ''; $('pairBtn').disabled = true; $('pairErr').textContent = '';
  });

  initAuth();
  connect();
})();
</script>
</body>
</html>
