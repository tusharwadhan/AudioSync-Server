<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0506">
<title>SyncAura Console</title>
<style>
  :root{
    --bg:#0a0506; --card:#150e0b; --key:#1c1310; --line:#2b1d16;
    --txt:#f3e9e2; --dim:#9c8a7f; --accent:#ff8a3d; --accent2:#ff5a1f; --err:#e6553d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(120% 70% at 50% 0%,#2a120a 0%,var(--bg) 60%);
       color:var(--txt);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;
       display:grid;place-items:center;
       padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  .box{width:min(100%,340px);display:flex;flex-direction:column;align-items:center;gap:22px}
  .logo{width:56px;height:56px;border-radius:16px;
        background:linear-gradient(135deg,var(--accent),var(--accent2));
        display:grid;place-items:center;box-shadow:0 8px 30px #ff5a1f40}
  .logo svg{width:28px;height:28px;fill:#1a0d05}
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.01em}
  .sub{color:var(--dim);font-size:13px;margin-top:-16px;min-height:20px;text-align:center}
  .sub.err{color:var(--err)}
  .dots{display:flex;gap:16px;height:16px}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);
       transition:background .12s,border-color .12s,transform .12s}
  .dot.on{background:var(--accent);border-color:var(--accent);transform:scale(1.1)}
  .dots.shake{animation:shake .4s}
  .dots.shake .dot{border-color:var(--err);background:var(--err)}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
  .pad button{height:64px;border-radius:18px;border:1px solid var(--line);
              background:var(--key);color:var(--txt);font:inherit;font-size:24px;
              font-weight:600;cursor:pointer;touch-action:manipulation;
              transition:background .08s,transform .08s}
  .pad button:active{background:#2a1a12;transform:scale(.96)}
  .pad button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pad button.ghost{background:transparent;border-color:transparent;font-size:15px;color:var(--dim)}
  .pad button:disabled{opacity:.4;cursor:not-allowed}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="box">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 3a1 1 0 0 1 1 1v16a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1zM7 8a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0V9a1 1 0 0 1 1-1zm10 0a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0V9a1 1 0 0 1 1-1zM3 11a1 1 0 0 1 1 1 1 1 0 1 1-2 0 1 1 0 0 1 1-1zm18 0a1 1 0 0 1 1 1 1 1 0 1 1-2 0 1 1 0 0 1 1-1z"/></svg>
  </div>
  <h1>SyncAura Console</h1>
  <div class="sub" id="sub" role="status" aria-live="polite">Enter your PIN</div>
  <div class="dots" id="dots" aria-hidden="true">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="ghost" disabled aria-hidden="true"></button>
    <button data-k="0">0</button>
    <button class="ghost" data-k="del" aria-label="Delete">Delete</button>
  </div>
</main>
<script>
(function(){
  var pin = "", busy = false, lockTimer = null;
  var dots = document.querySelectorAll(".dot");
  var dotsEl = document.getElementById("dots");
  var sub = document.getElementById("sub");
  var keys = document.querySelectorAll("#pad button[data-k]");

  function render(){
    for(var i=0;i<dots.length;i++) dots[i].classList.toggle("on", i<pin.length);
  }
  function say(msg, err){ sub.textContent = msg; sub.classList.toggle("err", !!err); }
  function setDisabled(d){ keys.forEach(function(b){ b.disabled = d; }); }

  function startLock(sec){
    setDisabled(true);
    clearInterval(lockTimer);
    var left = sec;
    function tick(){
      if(left <= 0){
        clearInterval(lockTimer); setDisabled(false);
        say("Enter your PIN", false); return;
      }
      var m = Math.floor(left/60), s = left%60;
      say("Too many attempts — try again in " + m + ":" + (s<10?"0":"") + s, true);
      left--;
    }
    tick(); lockTimer = setInterval(tick, 1000);
  }

  function fail(msg){
    pin = "";
    dotsEl.classList.add("shake");
    say(msg, true);
    setTimeout(function(){ dotsEl.classList.remove("shake"); render(); }, 420);
  }

  function submit(){
    busy = true; setDisabled(true); say("Checking…", false);
    fetch("/admin/morning/pin", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      credentials: "same-origin",
      body: JSON.stringify({pin: pin})
    }).then(function(r){
      if(r.ok){ location.reload(); return; }
      return r.json().catch(function(){ return {}; }).then(function(j){
        busy = false;
        if(r.status === 429){ pin = ""; render(); startLock(j.retryAfter || 900); return; }
        setDisabled(false);
        fail("Wrong PIN");
      });
    }).catch(function(){
      busy = false; setDisabled(false); fail("Can't reach the server");
    });
  }

  function press(k){
    if(busy) return;
    if(k === "del"){ pin = pin.slice(0,-1); render(); return; }
    if(pin.length >= 4) return;
    pin += k; render();
    if(pin.length === 4) submit();
  }

  document.getElementById("pad").addEventListener("click", function(e){
    var b = e.target.closest("button[data-k]");
    if(b && !b.disabled) press(b.getAttribute("data-k"));
  });
  document.addEventListener("keydown", function(e){
    if(e.key >= "0" && e.key <= "9") press(e.key);
    else if(e.key === "Backspace") press("del");
  });
  render();
  /*__LOCK__*/
})();
</script>
</body>
</html>
