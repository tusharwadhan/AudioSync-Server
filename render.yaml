services:
  - type: web
    name: audiosync-api
    env: python
    plan: free
    buildCommand: |
      curl -fsSL https://deno.land/install.sh | sh
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DENO_INSTALL
        value: /opt/render/.deno
      - key: PATH
        value: /opt/render/.deno/bin:$PATH
